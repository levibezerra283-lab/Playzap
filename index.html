<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayZap | Arcade 350+</title>
    <style>
        :root { --neon: #00ff44; --bg: #0b0b0b; --card: #1a1a1a; }
        body { background-color: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 50px; text-align: center; }
        
        /* HEADER E BUSCA */
        header { padding: 20px; background: #111; border-bottom: 2px solid var(--neon); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 2rem; font-weight: bold; color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        #searchBar { width: 85%; max-width: 400px; padding: 12px; border-radius: 25px; border: none; background: #222; color: #fff; margin-top: 10px; outline: none; }

        /* DESTAQUE */
        .section-title { text-align: left; padding: 20px 5% 5px; color: var(--neon); font-size: 1.2rem; font-weight: bold; }
        .featured-card { width: 90%; height: 200px; margin: 10px auto; border: 3px solid var(--neon); border-radius: 20px; display: flex; align-items: center; justify-content: center; background: linear-gradient(45deg, #111, #222); cursor: pointer; position: relative; overflow: hidden; }
        .featured-card h2 { position: absolute; bottom: 10px; left: 20px; margin: 0; }

        /* GRID 2 COLUNAS (O QUE VOCÊ PEDIU: @@ @@) */
        .container-jogos { 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* Duas colunas fixas */
            gap: 15px; 
            padding: 15px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .game-card { background: var(--card); border: 2px solid #333; border-radius: 15px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; padding: 10px; }
        .game-card:hover { border-color: var(--neon); }
        .game-card b { font-size: 0.85rem; color: var(--neon); text-transform: uppercase; }

        /* TELA DE JOGO (FULLSCREEN) */
        #gameMaster { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2147483647; display: none; }
        #globalIframe { width: 100%; height: 100%; border: none; }

        /* BOLA FLUTUANTE */
        #gameOverlay { position: absolute; top: 20px; right: 20px; width: 60px; height: 60px; z-index: 100001; }
        .config-btn { background: #000; border: 3px solid var(--neon); color: var(--neon); font-size: 28px; width: 100%; height: 100%; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px var(--neon); }
        .config-menu { position: absolute; top: 70px; right: 0; background: #1a1a1a; border: 2px solid var(--neon); padding: 15px; border-radius: 12px; width: 200px; display: none; text-align: left; }
        .config-menu button { width: 100%; background: var(--neon); border: none; padding: 12px; margin-top: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; color: #000; }

        #btnMais { background: var(--neon); color: #000; border: none; padding: 15px 40px; font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin: 30px auto; display: inline-block; }
    </style>
</head>
<body>

<div id="gameMaster">
    <div id="gameOverlay">
        <div class="config-btn" id="dragBtn">⚙️</div>
        <div class="config-menu" id="configMenu">
            <span id="fps" style="color:var(--neon)">FPS: 60</span>
            <button onclick="fecharJogo()" style="background: #ff4444; color: white;">❌ SAIR DO JOGO</button>
            <p style="font-size: 10px; color: #888; margin-top: 10px;">Atalho: Tecla J</p>
        </div>
    </div>
    <iframe id="globalIframe" src="" allow="fullscreen; pointer-lock; autoplay"></iframe>
</div>

<header>
    <div class="logo">PLAYZAP</div>
    <input type="text" id="searchBar" placeholder="Pesquisar entre 350 jogos..." oninput="filtrar()">
</header>

<div class="section-title">🔥 DESTAQUE DO DIA</div>
<div id="destaque-area"></div>

<div class="section-title">🎮 TODOS OS JOGOS</div>
<div class="container-jogos" id="lista-jogos"></div>

<button id="btnMais" onclick="carregarTudo()">CARREGAR TODOS OS 350 JOGOS</button>

<script>
    const nomesFamosos = ["Minefun.io", "Vectaria.io", "Bloxd.io", "Ev.io", "Krunker.io", "Subway Surfers", "Shell Shockers", "Gartic.io", "Snake.io", "Zombs Royale", "Suroi.io", "Moto X3M", "Paper.io 2", "Agar.io", "Hole.io", "Smash Karts", "Slither.io", "Diep.io", "Skribbl.io", "Moomoo.io", "Wings.io", "Splix.io", "Deeeep.io", "Territorial.io", "BuildRoyale.io", "LittleBigSnake", "Warcall.io", "FlyOrDie.io"];

    const todosJogos = [];
    for(let i = 0; i < 350; i++) {
        const n = nomesFamosos[i % nomesFamosos.length];
        todosJogos.push({
            n: i < nomesFamosos.length ? n : n + " " + (Math.floor(i/nomesFamosos.length) + 1),
            u: i === 0 ? "https://minefun.io" : i === 1 ? "https://vectaria.io" : "https://v6p9d9t4.ssl.hwcdn.net/html/1647242/index.html"
        });
    }

    function renderizarDestaque() {
        document.getElementById('destaque-area').innerHTML = `
            <div class="featured-card" onclick="abrir('${todosJogos[0].u}')">
                <h2>${todosJogos[0].n}</h2>
            </div>
        `;
    }

    function renderizarJogos(quantidade) {
        const lista = document.getElementById('lista-jogos');
        lista.innerHTML = "";
        todosJogos.slice(0, quantidade).forEach(j => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `<b>${j.n}</b>`;
            card.onclick = () => abrir(j.u);
            lista.appendChild(card);
        });
    }

    function abrir(url) {
        const master = document.getElementById('gameMaster');
        document.getElementById('globalIframe').src = url;
        master.style.display = "block";
        
        // Ativa Fullscreen automático
        if (master.requestFullscreen) master.requestFullscreen();
        else if (master.webkitRequestFullscreen) master.webkitRequestFullscreen();

        // Reforço da bola flutuante
        const overlay = document.getElementById('gameOverlay');
        const interval = setInterval(() => {
            if(master.style.display === "none") clearInterval(interval);
            master.appendChild(overlay);
        }, 1000);
    }

    function fecharJogo() {
        if (document.fullscreenElement) document.exitFullscreen();
        document.getElementById('gameMaster').style.display = "none";
        document.getElementById('globalIframe').src = "";
    }

    function carregarTudo() {
        renderizarJogos(350);
        document.getElementById('btnMais').style.display = 'none';
    }

    function filtrar() {
        const busca = document.getElementById('searchBar').value.toLowerCase();
        renderizarJogos(350); // Expande para buscar em tudo
        document.querySelectorAll('.game-card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(busca) ? "flex" : "none";
        });
    }

    // Atalho J
    document.addEventListener('keydown', (e) => {
        if(e.key.toLowerCase() === 'j') {
            const menu = document.getElementById('configMenu');
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }
    });

    document.getElementById('dragBtn').onclick = () => {
        const menu = document.getElementById('configMenu');
        menu.style.display = menu.style.display === "block" ? "none" : "block";
    };

    // Inicialização
    renderizarDestaque();
    renderizarJogos(16); // Começa com 16 para ficar leve

    document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement) fecharJogo(); });
</script>

</body>
</html>
